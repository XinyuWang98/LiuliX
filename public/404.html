<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script>
        // SPA Fallback: redirect all 404s to index.html with the original path
        const path = window.location.pathname + window.location.search + window.location.hash;
        window.location.replace('/' + '?redirect=' + encodeURIComponent(path));
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
