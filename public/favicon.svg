<svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- 背景：深色圆角矩形，适配 Light/Dark 模式，且符合 LiuliX 深色调性 -->
    <rect width="100" height="100" rx="24" fill="#0B1121" />

    <!-- 定义渐变 -->
    <defs>
        <!-- 1. 磨砂材质 -->
        <linearGradient id="frostedGradient" x1="0" y1="100" x2="100" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
            <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1" />
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4" />
        </linearGradient>

        <!-- 2. 晶体材质 -->
        <linearGradient id="crystalGradient" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
            <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.2" />
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.8" />
        </linearGradient>

        <!-- 3. 边缘光 -->
        <linearGradient id="sharpEdge" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1.0" />
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5" />
        </linearGradient>
    </defs>

    <!-- 图标主体（Logo.tsx 中的内容，已缩放适配圆角矩形） -->
    <g transform="translate(10, 10) scale(0.8)">
        <!-- Layer 1: 底层磨砂板 -->
        <g>
            <path
                d="M20 90 L38 90 L85 15 L67 15 Z"
                fill="url(#frostedGradient)"
                stroke="#FFFFFF"
                stroke-width="0.5"
                stroke-opacity="0.2"
            />
            <path
                d="M20 90 L67 15 L65 15 L18 90 Z"
                fill="#FFFFFF"
                fill-opacity="0.2"
            />
        </g>

        <!-- Layer 2: 顶层晶体板 -->
        <g>
            <!-- 投影 -->
            <path
                d="M15 15 L33 15 L80 90 L62 90 Z"
                fill="#000"
                fill-opacity="0.2"
                style="mix-blend-mode: overlay; filter: blur(4px)"
                transform="translate(2, 4)"
            />

            <!-- 玻璃主体 -->
            <path
                d="M15 15 L33 15 L80 90 L62 90 Z"
                fill="url(#crystalGradient)"
                stroke="url(#sharpEdge)"
                stroke-width="1.5"
            />

            <!-- 内部高光折射 -->
            <path
                d="M33 15 L30 15 L77 90 L80 90 Z"
                fill="#fff"
                fill-opacity="0.4"
                style="mix-blend-mode: overlay"
            />
        </g>
    </g>
</svg>
