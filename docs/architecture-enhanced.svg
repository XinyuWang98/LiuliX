    <rect x="720" y="450" width="210" height="40" rx="8" fill="#9b59b6" />
    <text x="825" y="475" text-anchor="middle" fill="#fff" font-size="10">AI: 生成清洗 SQL</text>

    <rect x="720" y="880" width="210" height="40" rx="8" fill="#9b59b6" />
    <text x="825" y="905" text-anchor="middle" fill="#fff" font-size="10">AI: 假设生成 (Hypothesis)</text>

    <rect x="720" y="1410" width="210" height="40" rx="8" fill="#9b59b6" />
