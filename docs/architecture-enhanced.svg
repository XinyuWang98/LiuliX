    <rect x="220" y="980" width="210" height="40" rx="8" fill="#61dafb" stroke="#21a1c4" stroke-width="2" />
    <text x="325" y="1005" text-anchor="middle" font-size="10">HypothesisCard 渲染</text>

    <rect x="220" y="1410" width="210" height="40" rx="8" fill="#61dafb" stroke="#21a1c4" stroke-width="2" />
    <text x="325" y="1435" text-anchor="middle" font-size="10">ReportSummary 展示</text>

    <rect x="470" y="150" width="210" height="40" rx="8" fill="#e67e22" />
    <text x="575" y="175" text-anchor="middle" fill="#fff" font-size="11">Wasm 分块采样计算</text>

    <rect x="470" y="450" width="210" height="40" rx="8" fill="#e67e22" />
