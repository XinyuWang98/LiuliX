            <polygon points="0 0, 10 3.5, 0 7" fill="#e74c3c" />
        </marker>
    </defs>

    <rect width="2000" height="1800" fill="#fafafa" />

    <rect x="0" y="100" width="200" height="1600" fill="#e8f4fc" opacity="0.4" />
