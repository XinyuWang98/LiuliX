    <rect x="30" y="1680" width="1940" height="70" rx="10" fill="#f1f2f6" />
    <text x="60" y="1715" font-weight="bold" font-size="14">层级说明：</text>
    <text x="180" y="1715" font-size="11">连接线置于背景之上、矩形之下。矩形与文字位于最顶层，确保无遮挡。</text>
