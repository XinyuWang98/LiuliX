<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1800" width="2000" height="1800">
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#555" />
        </marker>
    </defs>

    <rect width="2000" height="1800" fill="#f0f2f5" />

    <rect x="0" y="0" width="2000" height="60" fill="#2c3e50" />
    <text x="1000" y="38" text-anchor="middle" fill="#ffffff" font-family="Microsoft YaHei, sans-serif" font-size="24"
        font-weight="bold">DataPrism 业务链路最终架构图 (层级审计修正版)</text>

    <rect x="0" y="60" width="2000" height="40" fill="#34495e" />
    <text x="100" y="85" text-anchor="middle" fill="#ffffff" font-family="Microsoft YaHei, sans-serif" font-size="14"
        font-weight="bold">👤 用户操作</text>
    <text x="350" y="85" text-anchor="middle" fill="#ffffff" font-family="Microsoft YaHei, sans-serif" font-size="14"
        font-weight="bold">⚛️ React 线程</text>
    <text x="650" y="85" text-anchor="middle" fill="#ffffff" font-family="Microsoft YaHei, sans-serif" font-size="14"
        font-weight="bold">⚙️ Wasm Worker</text>
    <text x="950" y="85" text-anchor="middle" fill="#ffffff" font-family="Microsoft YaHei, sans-serif" font-size="14"
        font-weight="bold">🤖 AIService</text>
    <text x="1250" y="85" text-anchor="middle" fill="#ffffff" font-family="Microsoft YaHei, sans-serif" font-size="14"
        font-weight="bold">📊 可视化</text>
    <text x="1550" y="85" text-anchor="middle" fill="#ffffff" font-family="Microsoft YaHei, sans-serif" font-size="14"
        font-weight="bold">🛡️ 验证/状态</text>

    <g stroke="#bdc3c7" stroke-width="1">
        <line x1="200" y1="100" x2="200" y2="1700" />
        <line x1="500" y1="100" x2="500" y2="1700" />
        <line x1="800" y1="100" x2="800" y2="1700" stroke="#3498db" stroke-width="2" stroke-dasharray="5,2" />
        <line x1="1100" y1="100" x2="1100" y2="1700" stroke="#9b59b6" stroke-width="2" stroke-dasharray="5,2" />
        <line x1="1400" y1="100" x2="1400" y2="1700" />
        <line x1="1700" y1="100" x2="1700" y2="1700" />
    </g>
    <g stroke="#bdc3c7" stroke-width="1" stroke-dasharray="8,4">
        <line x1="0" y1="400" x2="2000" y2="400" />
        <line x1="0" y1="850" x2="2000" y2="850" />
        <line x1="0" y1="1350" x2="2000" y2="1350" />
    </g>

    <style>
        .box {
            rx: 8;
            stroke-width: 2;
        }

        .user-box {
            fill: #2c3e50;
            stroke: #1a252f;
        }

        .react-box {
            fill: #2980b9;
            stroke: #1c5980;
        }

        /* 加深以适配白字 */
        .wasm-box {
            fill: #d35400;
            stroke: #a04000;
        }

        /* 加深以适配白字 */
        .ai-box {
            fill: #8e44ad;
            stroke: #6c3483;
        }

        /* 加深以适配白字 */
        .validator-box {
            fill: #f39c12;
            stroke: #b7770d;
        }

        /* 加深以适配白字 */
        .parser-box {
            fill: #8e44ad;
            stroke: #6c3483;
        }

        /* 加深以适配白字 */
        .viz-box {
            fill: #2980b9;
            stroke: #1c5980;
        }

        /* 加深以适配白字 */
        .evidence-box {
            fill: #16a085;
            stroke: #0e6655;
        }

        /* 加深以适配白字 */
        .text-white {
            fill: #ffffff;
            font-family: Microsoft YaHei, sans-serif;
            font-size: 14px;
            text-anchor: middle;
            alignment-baseline: middle;
        }

        .line-connect {
            stroke: #555;
            stroke-width: 2;
            fill: none;
            marker-end: url(#arrow);
        }

        .line-feedback {
            stroke: #555;
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 5, 5;
            marker-end: url(#arrow);
        }
    </style>

    <rect x="30" y="150" width="140" height="50" class="box user-box" />
    <text x="100" y="175" class="text-white">上传文件</text>

    <line x1="170" y1="175" x2="250" y2="175" class="line-connect" />

    <rect x="250" y="150" width="200" height="50" class="box react-box" />
    <text x="350" y="175" class="text-white">UI: 接收原始文件</text>

    <line x1="450" y1="175" x2="550" y2="175" class="line-connect" />

    <rect x="550" y="150" width="200" height="50" class="box wasm-box" />
    <text x="650" y="175" class="text-white">Wasm: 分块采样计算</text>

    <rect x="30" y="550" width="140" height="50" class="box user-box" />
    <text x="100" y="575" class="text-white">数据清洗</text>

    <rect x="550" y="450" width="200" height="50" class="box wasm-box" />
    <text x="650" y="475" class="text-white">提取元数据</text>

    <line x1="750" y1="475" x2="850" y2="475" class="line-connect" />

    <rect x="850" y="450" width="200" height="50" class="box ai-box" />
    <text x="950" y="475" class="text-white">AI: 生成清洗 SQL</text>

    <line x1="1050" y1="475" x2="1450" y2="475" class="line-connect" />

    <rect x="1450" y="450" width="200" height="50" class="box validator-box" />
    <text x="1550" y="475" class="text-white">SQL Validator</text>

    <path d="M 1550 500 L 1550 575 L 450 575" class="line-feedback" />

    <rect x="250" y="550" width="200" height="50" class="box react-box" />
    <text x="350" y="575" class="text-white">清洗预览 &amp; 确认</text>

    <line x1="170" y1="575" x2="250" y2="575" class="line-connect" />
    <path d="M 100 600 L 100 675 L 550 675" class="line-connect" />

    <rect x="550" y="650" width="200" height="50" class="box wasm-box" />
    <text x="650" y="675" class="text-white">执行本地清洗事务</text>

    <rect x="30" y="1000" width="140" height="50" class="box user-box" />
    <text x="100" y="1025" class="text-white">洞察链路</text>

    <rect x="850" y="900" width="200" height="50" class="box ai-box" />
    <text x="950" y="925" class="text-white">AI: 假设生成</text>

    <line x1="1050" y1="925" x2="1450" y2="925" class="line-connect" />

    <rect x="1450" y="900" width="200" height="60" class="box parser-box" />
    <text x="1550" y="930" class="text-white">Hypothesis 解析器</text>

    <path d="M 1450 950 L 350 950 L 350 1000" class="line-connect" />

    <rect x="250" y="1000" width="200" height="50" class="box react-box" />
    <text x="350" y="1025" class="text-white">HypothesisCard 渲染</text>

    <line x1="170" y1="1025" x2="250" y2="1025" class="line-connect" />
    <path d="M 100 1050 L 100 1125 L 550 1125" class="line-connect" />

    <rect x="550" y="1100" width="200" height="50" class="box wasm-box" />
    <text x="650" y="1125" class="text-white">运行分析 SQL</text>

    <line x1="750" y1="1125" x2="1150" y2="1125" class="line-connect" />

    <rect x="1150" y="1100" width="200" height="50" class="box viz-box" />
    <text x="1250" y="1125" class="text-white">图表渲染</text>

    <rect x="30" y="1500" width="140" height="50" class="box user-box" />
    <text x="100" y="1525" class="text-white">分析报告</text>

    <path d="M 1250 1150 L 1250 1425 L 1450 1425" class="line-connect" />

    <rect x="1450" y="1400" width="200" height="50" class="box evidence-box" />
    <text x="1550" y="1425" class="text-white">Evidence 证据整合</text>

    <path d="M 1550 1450 L 1550 1525 L 1050 1525" class="line-connect" />

    <rect x="850" y="1500" width="200" height="50" class="box ai-box" />
    <text x="950" y="1525" class="text-white">AI: 摘要报告</text>

    <line x1="850" y1="1525" x2="450" y2="1525" class="line-connect" />

    <rect x="250" y="1500" width="200" height="50" class="box react-box" />
    <text x="350" y="1525" class="text-white">ReportSummary 展示</text>

    <line x1="170" y1="1525" x2="250" y2="1525" class="line-connect" />

    <rect x="30" y="1720" width="1940" height="60" rx="10" fill="#34495e" />
    <text x="60" y="1755" class="text-white" font-weight="bold">图例说明：</text>
    <line x1="200" y1="1750" x2="240" y2="1750" stroke="#3498db" stroke-width="2" stroke-dasharray="5,2" /><text x="250"
        y="1755" class="text-white" font-size="12">本地隐私边界</text>
    <line x1="400" y1="1750" x2="440" y2="1750" stroke="#9b59b6" stroke-width="2" stroke-dasharray="5,2" /><text x="450"
        y="1755" class="text-white" font-size="12">AI 服务边界</text>
    <rect x="600" y="1740" width="20" height="20" fill="#f39c12" stroke="#b7770d" stroke-width="2" /><text x="630"
        y="1755" class="text-white" font-size="12">SQL 验证器</text>
    <rect x="750" y="1740" width="20" height="20" fill="#8e44ad" stroke="#6c3483" stroke-width="2" /><text x="780"
        y="1755" class="text-white" font-size="12">Hypothesis 解析器</text>
    <rect x="950" y="1740" width="20" height="20" fill="#16a085" stroke="#0e6655" stroke-width="2" /><text x="980"
        y="1755" class="text-white" font-size="12">Evidence 整合器</text>
</svg>